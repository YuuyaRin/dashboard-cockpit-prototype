        fault:{summary:[[&#x27;今日故障&#x27;,&#x27;7起&#x27;],[&#x27;处理中&#x27;,&#x27;2起&#x27;],[&#x27;超时 SLA&#x27;,&#x27;1起&#x27;]],levels:[{title:&#x27;故障与工单概览&#x27;,note:&#x27;当前为目标数据结构，需接入独立工单或故障数据源。&#x27;,columns:[&#x27;类型&#x27;,&#x27;新增&#x27;,&#x27;处理中&#x27;,&#x27;已恢复&#x27;],rows:[[&#x27;认证故障&#x27;,&#x27;3&#x27;,&#x27;1&#x27;,&#x27;2&#x27;],[&#x27;网络故障&#x27;,&#x27;2&#x27;,&#x27;1&#x27;,&#x27;1&#x27;],[&#x27;用户反馈&#x27;,&#x27;2&#x27;,&#x27;0&#x27;,&#x27;2&#x27;]]},{title:&#x27;故障状态与影响&#x27;,note:&#x27;需提供影响用户、开始/恢复时间和责任方。&#x27;,columns:[&#x27;故障编号&#x27;,&#x27;状态&#x27;,&#x27;影响用户&#x27;,&#x27;持续时间&#x27;],rows:[[&#x27;INC-0824-07&#x27;,&#x27;处理中&#x27;,&#x27;126&#x27;,&#x27;34分钟&#x27;],[&#x27;INC-0824-05&#x27;,&#x27;处理中&#x27;,&#x27;48&#x27;,&#x27;51分钟&#x27;],[&#x27;INC-0824-03&#x27;,&#x27;已恢复&#x27;,&#x27;302&#x27;,&#x27;18分钟&#x27;]]}]}
      };

      let profile = &#x27;standard&#x27;;
      let moduleId = &#x27;overview&#x27;;
      let period = &#x27;7d&#x27;;
      let reviewMode = true;
      let selectedId = null;
      let drillStep = 0;
      let noticeTimer = null;

      const evidenceBadge = item =&gt; `&lt;span class=&quot;sc-evidence&quot; data-level=&quot;${item.evidence.charAt(0)}&quot;&gt;证据 ${item.evidence}&lt;/span&gt;`;
      const statusBadge = item =&gt; `&lt;span class=&quot;sc-state&quot;&gt;联调 ${item.status}&lt;/span&gt;`;

      function points(values, width = 320, height = 112) {
        const min = Math.min(...values);
        const max = Math.max(...values);
        const span = Math.max(1, max - min);
        return values.map((value, index) =&gt; {
          const x = 8 + index * ((width - 16) / (values.length - 1));
          const y = height - 22 - ((value - min) / span) * (height - 42);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(&#x27; &#x27;);
      }

      function lineChart(item) {
        const primary = points(item.series);
        const secondary = item.series2 ? `&lt;polyline class=&quot;sc-chart-secondary&quot; points=&quot;${points(item.series2)}&quot;&gt;&lt;/polyline&gt;` : &#x27;&#x27;;
        const area = `8,90 ${primary} 312,90`;
        const legend2 = item.legend?.[1] ? `&lt;circle cx=&quot;88&quot; cy=&quot;10&quot; r=&quot;3&quot; fill=&quot;var(--sc-purple)&quot;&gt;&lt;/circle&gt;&lt;text class=&quot;sc-chart-legend&quot; x=&quot;96&quot; y=&quot;13&quot;&gt;${item.legend[1]}&lt;/text&gt;` : &#x27;&#x27;;
        return `&lt;svg class=&quot;sc-chart&quot; viewBox=&quot;0 0 320 112&quot; preserveAspectRatio=&quot;none&quot; role=&quot;img&quot; aria-label=&quot;${item.name}，单位 ${item.chartUnit || &#x27;&#x27;}&quot;&gt;
          &lt;line class=&quot;sc-chart-grid&quot; x1=&quot;8&quot; y1=&quot;26&quot; x2=&quot;312&quot; y2=&quot;26&quot;&gt;&lt;/line&gt;&lt;line class=&quot;sc-chart-grid&quot; x1=&quot;8&quot; y1=&quot;58&quot; x2=&quot;312&quot; y2=&quot;58&quot;&gt;&lt;/line&gt;&lt;line class=&quot;sc-chart-grid&quot; x1=&quot;8&quot; y1=&quot;90&quot; x2=&quot;312&quot; y2=&quot;90&quot;&gt;&lt;/line&gt;
          &lt;polygon class=&quot;sc-chart-area&quot; points=&quot;${area}&quot;&gt;&lt;/polygon&gt;${secondary}&lt;polyline class=&quot;sc-chart-primary&quot; points=&quot;${primary}&quot;&gt;&lt;/polyline&gt;
          &lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;3&quot; fill=&quot;var(--sc-accent)&quot;&gt;&lt;/circle&gt;&lt;text class=&quot;sc-chart-legend&quot; x=&quot;18&quot; y=&quot;13&quot;&gt;${item.legend?.[0] || item.name}&lt;/text&gt;${legend2}
          &lt;text class=&quot;sc-chart-label&quot; x=&quot;8&quot; y=&quot;106&quot;&gt;${periodLabels[period]}&lt;/text&gt;&lt;text class=&quot;sc-chart-label&quot; x=&quot;312&quot; y=&quot;106&quot; text-anchor=&quot;end&quot;&gt;单位：${item.chartUnit || &#x27;--&#x27;}&lt;/text&gt;
        &lt;/svg&gt;`;
      }

      function barsChart(item) {
        return `&lt;div class=&quot;sc-bars&quot; role=&quot;img&quot; aria-label=&quot;${item.name}结构分布&quot;&gt;${item.bars.map(row =&gt; `&lt;div class=&quot;sc-bar-row&quot;&gt;&lt;span class=&quot;sc-bar-name&quot;&gt;${row[0]}&lt;/span&gt;&lt;span class=&quot;sc-bar-track&quot;&gt;&lt;span class=&quot;sc-bar-fill&quot; style=&quot;width:${row[2]}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;sc-bar-value&quot;&gt;${row[1]}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }

      function kpiHtml(id) {
        const item = components[id];
        const trendClass = item.trend === &#x27;up&#x27; ? &#x27;sc-trend-up&#x27; : item.trend === &#x27;warn&#x27; ? &#x27;sc-trend-warn&#x27; : &#x27;&#x27;;
        return `&lt;button type=&quot;button&quot; class=&quot;sc-kpi&quot; data-component=&quot;${id}&quot; aria-label=&quot;查看${item.name}详情&quot;&gt;
          &lt;span class=&quot;sc-kpi-head&quot;&gt;&lt;span class=&quot;sc-label&quot;&gt;${item.name}&lt;/span&gt;&lt;span&gt;${evidenceBadge(item)}${statusBadge(item)}&lt;/span&gt;&lt;/span&gt;
          &lt;span class=&quot;sc-value&quot;&gt;${item.value || &#x27;--&#x27;} &lt;span class=&quot;sc-unit&quot;&gt;${item.unit || &#x27;&#x27;}&lt;/span&gt;&lt;/span&gt;
          &lt;span class=&quot;sc-note ${trendClass}&quot;&gt;${item.note}&lt;/span&gt;
        &lt;/button&gt;`;
      }

      function panelHtml(id, span) {
        const item = components[id];
        return `&lt;button type=&quot;button&quot; class=&quot;sc-panel&quot; data-component=&quot;${id}&quot; style=&quot;grid-column:span ${span}&quot; aria-label=&quot;钻取${item.name}&quot;&gt;
          &lt;span class=&quot;sc-panel-head&quot;&gt;&lt;span class=&quot;sc-panel-title&quot;&gt;${item.name}&lt;/span&gt;&lt;span&gt;${evidenceBadge(item)}${statusBadge(item)}&lt;/span&gt;&lt;/span&gt;
          &lt;span class=&quot;sc-panel-body&quot;&gt;${item.type === &#x27;line&#x27; ? lineChart(item) : barsChart(item)}&lt;/span&gt;
          &lt;span class=&quot;sc-panel-foot&quot;&gt;&lt;span class=&quot;sc-status-line&quot;&gt;&lt;span class=&quot;sc-live-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;${periodLabels[period]} · ${grainLabels[root.querySelector(&#x27;#sc-grain&#x27;).value]}粒度&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;sc-source-mini&quot;&gt;${item.source}&lt;/span&gt;&lt;/span&gt;
        &lt;/button&gt;`;
      }

      function currentLayout() {
        return layouts[profile]?.[moduleId] || null;
      }

      function renderProfileContext() {
        const item = profiles[profile];
        root.querySelector(&#x27;#sc-capability-line&#x27;).innerHTML = `&lt;span class=&quot;sc-profile-name&quot;&gt;${item.name}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${item.scope}&lt;/span&gt;&lt;span class=&quot;sc-capability-tag&quot;&gt;${item.drill}&lt;/span&gt;&lt;span class=&quot;sc-capability-tag&quot;&gt;${item.extra}&lt;/span&gt;&lt;span class=&quot;sc-capability-tag sc-blueprint-tag&quot;&gt;${item.blueprint}&lt;/span&gt;`;
        root.querySelectorAll(&#x27;[data-profile]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.profile === profile)));
      }

      function renderModules() {
        const allowed = profiles[profile].modules;
        root.querySelector(&#x27;#sc-module-tabs&#x27;).innerHTML = allowed.map(id =&gt; `&lt;button type=&quot;button&quot; class=&quot;sc-module&quot; data-module=&quot;${id}&quot; aria-selected=&quot;${id === moduleId}&quot;&gt;${modules[id]}&lt;/button&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-module]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          moduleId = button.dataset.module;
          closeDrawer();
          render();
        }));
      }

      function render() {
        if (!profiles[profile].modules.includes(moduleId)) moduleId = &#x27;overview&#x27;;
        const layout = currentLayout();
        if (!layout) return;
        root.dataset.review = reviewMode ? &#x27;on&#x27; : &#x27;off&#x27;;
        pageTitle.textContent = modules[moduleId];
        renderProfileContext();
        renderModules();
        const kpiGrid = root.querySelector(&#x27;#sc-kpi-grid&#x27;);
        kpiGrid.style.setProperty(&#x27;--sc-kpi-count&#x27;, layout.k.length);
        kpiGrid.innerHTML = layout.k.map(kpiHtml).join(&#x27;&#x27;);
        root.querySelector(&#x27;#sc-panel-grid&#x27;).innerHTML = layout.p.map(([id, span]) =&gt; panelHtml(id, span)).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-component]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openDrawer(button.dataset.component)));
      }

      function allowedDepth(item) {
        const modelDepth = drillModels[item.model].levels.length;
        const evidenceDepth = item.status === &#x27;S0&#x27; &amp;&amp; profile !== &#x27;enhanced&#x27; ? 1 : modelDepth;
        return Math.min(profileRank[profile], modelDepth, evidenceDepth);
      }

      function openDrawer(id) {
        selectedId = id;
        drillStep = 0;
        root.querySelector(&#x27;#sc-backdrop&#x27;).classList.add(&#x27;is-open&#x27;);
        root.querySelector(&#x27;#sc-drawer&#x27;).classList.add(&#x27;is-open&#x27;);
        root.querySelector(&#x27;#sc-drawer&#x27;).setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
        renderDrawer();
      }

      function closeDrawer() {
        root.querySelector(&#x27;#sc-backdrop&#x27;).classList.remove(&#x27;is-open&#x27;);
        root.querySelector(&#x27;#sc-drawer&#x27;).classList.remove(&#x27;is-open&#x27;);
        root.querySelector(&#x27;#sc-drawer&#x27;).setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        selectedId = null;
        drillStep = 0;
      }

      function tableHtml(level) {
        return `&lt;div class=&quot;sc-level-title&quot;&gt;${level.title}&lt;/div&gt;&lt;div class=&quot;sc-level-note&quot;&gt;${level.note}&lt;/div&gt;&lt;div class=&quot;sc-table-wrap&quot;&gt;&lt;table class=&quot;sc-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;${level.columns.map(label =&gt; `&lt;th&gt;${label}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${level.rows.map(row =&gt; `&lt;tr&gt;${row.map(value =&gt; `&lt;td title=&quot;${value}&quot;&gt;${value}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
      }

      function renderDrawer() {
        if (!selectedId) return;
        const item = components[selectedId];
        const model = drillModels[item.model];
        const depth = allowedDepth(item);
        drillStep = Math.min(drillStep, depth - 1);
        root.querySelector(&#x27;#sc-drawer-title&#x27;).textContent = item.name;
        root.querySelector(&#x27;#sc-drawer-subtitle&#x27;).textContent = `${profiles[profile].name} · ${periodLabels[period]} · 模拟数据`;
        root.querySelector(&#x27;#sc-crumbs&#x27;).innerHTML = model.levels.map((level, index) =&gt; `${index ? &#x27;&lt;span class=&quot;sc-crumb-arrow&quot;&gt;›&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;button type=&quot;button&quot; class=&quot;sc-crumb&quot; data-step=&quot;${index}&quot; aria-current=&quot;${index === drillStep ? &#x27;step&#x27; : &#x27;false&#x27;}&quot; ${index &gt;= depth ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${level.title}&lt;/button&gt;`).join(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-step]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          drillStep = Number(button.dataset.step);
          renderDrawer();
        }));
        root.querySelector(&#x27;#sc-drawer-summary&#x27;).innerHTML = model.summary.map(([label, value]) =&gt; `&lt;div class=&quot;sc-drawer-stat&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#sc-drill-content&#x27;).innerHTML = tableHtml(model.levels[drillStep]);
        const next = root.querySelector(&#x27;#sc-drill-next&#x27;);
        next.disabled = drillStep &gt;= depth - 1;
        next.textContent = drillStep &lt; depth - 1 ? `进入${model.levels[drillStep + 1].title}` : &#x27;当前条件到此层&#x27;;
        const totalDepth = model.levels.length;
        const restriction = depth &lt; totalDepth ? `${profiles[profile].name}当前开放 ${depth}/${totalDepth} 层` : `该指标已开放全部 ${totalDepth} 层`;
        root.querySelector(&#x27;#sc-limit&#x27;).textContent = item.status === &#x27;S0&#x27; ? `${restriction} · 真实环境需先取得样本` : restriction;
        const provenance = [
          [&#x27;接口/数据来源&#x27;, item.source],
          [&#x27;关键字段&#x27;, item.fields],
          [&#x27;计算口径&#x27;, item.formula],
          [&#x27;文档参考&#x27;, item.ref],
          [&#x27;文档证据&#x27;, item.evidence],
          [&#x27;联调状态&#x27;, `${item.status} · 当前模拟数据`]
        ];
        root.querySelector(&#x27;#sc-provenance&#x27;).innerHTML = provenance.map(([label, value]) =&gt; `&lt;div&gt;&lt;div class=&quot;sc-prov-label&quot;&gt;${label}&lt;/div&gt;&lt;div class=&quot;sc-prov-value&quot;&gt;${value}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function showNotice(message) {
        const notice = root.querySelector(&#x27;#sc-notice&#x27;);
        notice.textContent = message;
        notice.classList.add(&#x27;is-open&#x27;);
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() =&gt; notice.classList.remove(&#x27;is-open&#x27;), 2100);
      }

      root.querySelectorAll(&#x27;[data-profile]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const previous = profile;
        profile = button.dataset.profile;
        closeDrawer();
        if (!profiles[profile].modules.includes(moduleId)) moduleId = &#x27;overview&#x27;;
        render();
        showNotice(`${profiles[previous].name} → ${profiles[profile].name}：模块、指标和钻取权限已重新加载`);
      }));

      root.querySelectorAll(&#x27;[data-period]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        period = button.dataset.period;
        root.querySelectorAll(&#x27;[data-period]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item.dataset.period === period)));
        closeDrawer();
        render();
      }));

      root.querySelector(&#x27;#sc-grain&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; { closeDrawer(); render(); });
      root.querySelector(&#x27;#sc-review&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        reviewMode = !reviewMode;
        event.currentTarget.setAttribute(&#x27;aria-pressed&#x27;, String(reviewMode));
        render();
        if (selectedId) renderDrawer();
      });
      root.querySelector(&#x27;#sc-close&#x27;).addEventListener(&#x27;click&#x27;, closeDrawer);
      root.querySelector(&#x27;#sc-backdrop&#x27;).addEventListener(&#x27;click&#x27;, closeDrawer);
      root.querySelector(&#x27;#sc-drill-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!selectedId) return;
        const depth = allowedDepth(components[selectedId]);
        if (drillStep &lt; depth - 1) {
          drillStep += 1;
          renderDrawer();
        }
      });
      root.addEventListener(&#x27;keydown&#x27;, event =&gt; { if (event.key === &#x27;Escape&#x27;) closeDrawer(); });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
