          const x = 8 + index * ((width - 16) / (values.length - 1));

        root.querySelector('#sc-drawer-title').textContent = item.name;
        root.querySelector('#sc-drawer-subtitle').textContent = `${profiles[profile].name} · ${periodLabels[period]} · 模拟数据`;
        root.querySelector('#sc-crumbs').innerHTML = model.levels.map((level, index) =&gt; `${index ? '&lt;span class=&quot;sc-crumb-arrow&quot;&gt;›&lt;/span&gt;' : ''}&lt;button type=&quot;button&quot; class=&quot;sc-crumb&quot; data-step=&quot;${index}&quot; aria-current=&quot;${index === drillStep ? 'step' : 'false'}&quot; ${index &gt;= depth ? 'disabled' : ''}&gt;${level.title}&lt;/button&gt;`).join('');
        root.querySelectorAll('[data-step]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
          drillStep = Number(button.dataset.step);
          renderDrawer();
        }));
        root.querySelector('#sc-drawer-summary').innerHTML = model.summary.map(([label, value]) =&gt; `&lt;div class=&quot;sc-drawer-stat&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;&lt;/div&gt;`).join('');
        root.querySelector('#sc-drill-content').innerHTML = tableHtml(model.levels[drillStep]);
        const next = root.querySelector('#sc-drill-next');
        next.disabled = drillStep &gt;= depth - 1;
        next.textContent = drillStep &lt; depth - 1 ? `进入${model.levels[drillStep + 1].title}` : '当前条件到此层';
        const totalDepth = model.levels.length;
        const restriction = depth &lt; totalDepth ? `${profiles[profile].name}在原型中展示 ${depth}/${totalDepth} 层` : `原型展示该指标的全部 ${totalDepth} 层`;
        root.querySelector('#sc-limit').textContent = `${restriction} · 当前为设计原型，钻取内容使用模拟数据`;
        const provenance = [
          ['这个功能表示什么', componentDescriptions[selectedId]],
          ['接口/数据来源', item.source],
          ['准备使用的返回字段', item.fields],
          ['指标怎么计算', item.formula],
          ['文档位置', item.ref],
          ['文档依据等级', `${item.evidence} · ${evidenceMeanings[item.evidence] || '待说明'}`],
          ['当前确认进度', `${confirmationLabels[item.confirmation]} · ${confirmationMeanings[item.confirmation]}`],
          ['需要向对方确认或索取', componentQuestions[selectedId] || evidenceActions[item.evidence] || '根据具体指标补充确认问题和所需材料。'],
          ['如果对方无法提供', componentFallbacks[selectedId] || '隐藏该功能或换成文档依据更明确的内容。']
        ];
        root.querySelector('#sc-provenance').innerHTML = provenance.map(([label, value]) =&gt; `&lt;div&gt;&lt;div class=&quot;sc-prov-label&quot;&gt;${label}&lt;/div&gt;&lt;div class=&quot;sc-prov-value&quot;&gt;${value}&lt;/div&gt;&lt;/div&gt;`).join('');
      }

      function showNotice(message) {
        const notice = root.querySelector('#sc-notice');
        notice.textContent = message;
        notice.classList.add('is-open');
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() =&gt; notice.classList.remove('is-open'), 2100);
      }

      root.querySelectorAll('[data-profile]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
        const previous = profile;
        profile = button.dataset.profile;
        closeDrawer();
        if (!profiles[profile].modules.includes(moduleId)) moduleId = 'overview';
        render();
        showNotice(`${profiles[previous].name} → ${profiles[profile].name}：原型展示内容和钻取层级已切换`);
      }));

      root.querySelectorAll('[data-period]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
        period = button.dataset.period;
        root.querySelectorAll('[data-period]').forEach(item =&gt; item.setAttribute('aria-pressed', String(item.dataset.period === period)));
        closeDrawer();
        render();
        showNotice(`已切换为${periodLabels[period]}；当前为模拟原型，数值不会重新查询`);
      }));

      root.querySelector('#sc-grain').addEventListener('change', event =&gt; {
        closeDrawer();
        render();
        showNotice(`已切换为${grainLabels[event.target.value]}粒度；当前为模拟原型，数值不会重新查询`);
      });
      root.querySelector('#sc-review').addEventListener('click', event =&gt; {
        reviewMode = !reviewMode;
        event.currentTarget.setAttribute('aria-pressed', String(reviewMode));
        render();
        if (selectedId) renderDrawer();
      });
      root.querySelector('#sc-close').addEventListener('click', closeDrawer);
      root.querySelector('#sc-backdrop').addEventListener('click', closeDrawer);
      root.querySelector('#sc-drill-next').addEventListener('click', () =&gt; {
        if (!selectedId) return;
        const depth = allowedDepth(components[selectedId]);
        if (drillStep &lt; depth - 1) {
          drillStep += 1;
          renderDrawer();
        }
      });
      root.addEventListener('keydown', event =&gt; { if (event.key === 'Escape') closeDrawer(); });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe>
</body>
</html>
